name: barcelona (auto build for every upstream Bun release)

# Cron, not a webhook: upstream oven-sh/bun is a different repository, so its
# release event cannot trigger this workflow. An hourly tag poll plus an
# idempotent publish gives the same outcome with no inbound hook.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream tag (bun-v1.4.2) or 'latest'"
        default: "latest"
        required: false
      force:
        description: "rebuild even if that -barcelona release already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: barcelona
  cancel-in-progress: false

env:
  BOOTSTRAP_BUN: bun-v1.3.14 # runtime for scripts/build.ts; runs on the runner, not the target CPU
  ICU_SONAME: "74" # ubuntu-latest (noble) = ICU 74. Asserted below, never assumed.

jobs:
  # Cheap job: decide what, if anything, is new. Runs every cron tick; the
  # ~40-minute build only starts when an unshipped upstream tag exists.
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      release: ${{ steps.pick.outputs.release }}
      build: ${{ steps.pick.outputs.build }}
    steps:
      - name: Resolve target tag + idempotency
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          want="${{ inputs.tag }}"
          want="${want:-latest}"
          if [ "$want" = "latest" ]; then
            # live API today: bun-v1.4.2 bun-v1.4.1 bun-v1.4.0 bun-v1.3.14 ...
            want=$(curl -fsSL https://api.github.com/repos/oven-sh/bun/tags?per_page=40 \
              | grep -oE '"name": "bun-v[0-9][^"]*"' | cut -d'"' -f4 | sort -V | tail -1)
          fi
          test -n "$want" || { echo "::error::no upstream bun tag resolved"; exit 1; }
          case "$want" in bun-v*) : ;; *) echo "::error::$want is not a bun-v* tag"; exit 1 ;; esac
          ver="${want#bun-v}"
          rel="v${ver}-barcelona"

          build=true
          if [ "${{ inputs.force }}" != "true" ] \
             && gh release view "$rel" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            build=false
            echo "$rel already published -> build skipped (delete the release, or run with force, to rebuild)"
          fi

          {
            echo "tag=$want"; echo "version=$ver"; echo "release=$rel"; echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "target $want -> release $rel (build=$build)"

  build:
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE: ${{ needs.resolve.outputs.release }}
    steps:
      - name: Disk + swap for the WebKit+Bun link (~14 GB peak)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
                      /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean; sudo apt-get autoremove -y
          sudo swapoff /swapfile 2>/dev/null || true; sudo rm -f /swapfile || true
          (sudo fallocate -l 4G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=4096) \
            && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          df -h /; free -h

      - name: Toolchain (clang 21, ninja, cmake, ICU, binutils)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21 noble
          # nasm: bun-v1.4.2 scripts/build/config.ts -> "x64: nasm for BoringSSL's
          # win-x64 assembly and libjpeg-turbo's x86_64 SIMD". ubuntu-latest ships
          # without it; configure dies with "nasm not found in toolchain".
          sudo apt-get install -y --no-install-recommends \
            clang-21 lld-21 llvm-21-dev ninja-build cmake binutils nasm \
            libssl-dev liblz4-dev libzstd-dev libicu-dev g++-14 libstdc++-14-dev
          # Resolve, don't wish. Required tools, proven from the tag's source:
          #   compile.ts:272   assert(cfg.nasm !== undefined, "nasm not found in toolchain")
          #   configure.ts:327 findSystemTool("perl")  -> LUT codegen (create-hash-table.ts)
          #   config.ts:224    ld.lld on linux, lld-link on windows (never a bare `lld`;
          #                    bun may use rustc's bundled gcc-ld/ld.lld, config.ts:848)
          # plus clang/clang++/ninja/cmake/git/tar/make/ar/ranlib/objdump/strip used by
          # these steps; ccache/sccache are optional. apt spells names differently per
          # release and package (lld-21, binutils' ar/ranlib), and update-alternatives
          # may not have run in the image —
          # so search the usual prefixes for NAME / NAME-static / NAME-21 and publish the
          # bare name bun invokes. Every miss is reported by name and costs seconds, not
          # a WebKit build.
          need="clang clang++ ld.lld lld llvm-ar llvm-ranlib ninja cmake nasm perl git \
                tar make ar ranlib objdump strip"
          for n in $need; do
            command -v "$n" >/dev/null 2>&1 && continue
            found=""
            for d in /usr/local/bin /usr/bin /usr/lib/llvm-21/bin; do
              for c in "$d/$n-static" "$d/$n-21" "$d/$n"; do
                [ -x "$c" ] || continue
                found="$c"; break 2
              done
            done
            if [ -n "$found" ]; then sudo ln -sfn "$found" "/usr/local/bin/$n"; else
              echo "::error::$n unavailable"; exit 1; fi
            command -v "$n" >/dev/null 2>&1 || { echo "::error::$n not on PATH after linking"; exit 1; }
          done
          clang --version | head -1; nasm -v; ld.lld --version | head -1
          perl -v | sed -n 2p

      - name: Bootstrap Bun (build host runtime)
        run: |
          curl -fsSL https://bun.sh/install | bash -s "$BOOTSTRAP_BUN"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Clone bun @ ${{ env.TAG }} (tag, not the moving default branch)
        run: |
          git clone --depth 1 --branch "$TAG" https://github.com/oven-sh/bun.git /tmp/bun
          cd /tmp/bun && git describe --tags
          NIGHTLY=$(awk -F'"' '/^channel/ {print $2}' rust-toolchain.toml)
          test -n "$NIGHTLY" || { echo "::error::rust-toolchain.toml channel unreadable"; exit 1; }
          echo "RUST_NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"
          echo "rust $NIGHTLY (the tag's own pin, not a hardcoded date)"

      - name: Rust (toolchain from the tag)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
            --default-toolchain none --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          . "$HOME/.cargo/env"
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal \
            --component rust-src,rustfmt,clippy,llvm-tools --target x86_64-unknown-linux-gnu

      # One live patch. Upstream rust.ts has no "nehalem" literal (1.4.0 or 1.4.2);
      # it maps C flags to rustc flags, so -march=barcelona becomes
      # -Ctarget-cpu=barcelona by itself (rust.ts: -mcpu=X|-march=X -> -Ctarget-cpu=$value).
      # Both seds stay so the recipe survives an upstream revert of either form.
      # Three patches, each with a source citation. bun's x64 floor is nehalem
      # (flags.ts:71 "-march=nehalem ... no AVX, broadest compatibility"), i.e. SSE4.1.
      # K10 = SSE3 + SSE4a + ABM/POPCNT and NOT SSSE3, so SIMD levels drop to SSE2.
      # Vendored SIMD that already CPUID-dispatches needs nothing:
      #   deps/libwebp.ts:101  per-file -mavx2/-msse4.1/-msse2 + "runtime CPU dispatch
      #                        in dsp/cpu.c ... still runs on pre-AVX2 hardware"
      #   deps/zlib.ts:77-79   per-file -mssse3/-msse4.1/-msse4.2 with X86_* defines
      #   deps/libjpeg-turbo.ts:8  jsimd.c "picks between them per call from cpuid"
      # deps/libspng.ts:37 does NOT dispatch: it hardcodes SPNG_SSE: 4 ("4 = SSE4.1
      # defilter paths (pabsw/pblendvb); our x64 floor is nehalem"), which makes
      # always_inline _mm_blendv_epi8 fail to compile under -march=barcelona.
      - name: Patch nehalem -> barcelona (codegen + Rust + non-dispatching SIMD)
        run: |
          cd /tmp/bun
          sed -i 's/"-march=nehalem"/"-march=barcelona"/' scripts/build/flags.ts
          sed -i 's/? "nehalem"/? "barcelona"/' scripts/build/rust.ts
          sed -i 's/{ SPNG_SSE: 4 }/{ SPNG_SSE: 2 }/' scripts/build/deps/libspng.ts
          test "$(grep -c -- '-march=barcelona' scripts/build/flags.ts)" -ge 1 || {
            echo "::error::flags.ts anchor moved upstream; the sed is a silent no-op"; exit 1; }
          grep -n 'SPNG_SSE: 2' scripts/build/deps/libspng.ts || {
            echo "::error::libspng.ts SPNG_SSE anchor moved"; exit 1; }
          # any dep config still pinning a non-dispatched SIMD level above SSE3 would
          # SIGILL or fail to compile; fail here rather than 800 objects in.
          left=$(grep -RnoE 'SPNG_SSE: [3-9]|USE_SSE4[12][^_A-Za-z]' scripts/build/ || true)
          test -z "$left" || { echo "::error::undispatched SSE4.x constant remains: $left"; exit 1; }
          grep -n -A2 'flag: "-march=barcelona"' scripts/build/flags.ts

      - name: WebKit source @ the tag's pin
        run: |
          WK=$(grep -oE 'WEBKIT_VERSION = "[0-9a-f]{40}"' /tmp/bun/scripts/build/deps/webkit.ts | grep -oE '[0-9a-f]{40}')
          test -n "$WK" || { echo "::error::WEBKIT_VERSION pin format changed upstream"; exit 1; }
          echo "WEBKIT_SHA=$WK" >> "$GITHUB_ENV"
          git clone --filter=blob:none --no-checkout https://github.com/oven-sh/WebKit.git /tmp/WebKit
          cd /tmp/WebKit && git fetch --depth 1 origin "$WK" && git checkout FETCH_HEAD && git log --oneline -1

      # Build is 1645s of the ~2060s job (measured from run#6 step timings), and the
      # patch fixes that follow never touch C++ or Rust sources -- so the object
      # tree must survive between runs of the same tag. Keyed on TAG only, deliberately:
      # including the workflow hash would bust it on every CI-only edit, which is
      # exactly the iteration loop this exists to shorten.
      # Explicit restore/save instead of actions/cache@v4: the bundled post-step save is
      # SKIPPED when the job fails (run#7: "Post Cache the object tree — skipped"), which
      # is precisely the iteration where a warm tree is worth 27 minutes. Saving as a
      # step right after Build means a failed publish still leaves the tree cached.
      - name: Restore object tree
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/bun/build
            /tmp/WebKit
          key: obj-${{ env.TAG }}-llvm21
          restore-keys: obj-${{ env.TAG }}-


      # ninja compares mtimes. A fresh clone is newer than cache-restored objects, which
      # would rebuild all 1247 targets and make the cache worthless. Pin both source
      # trees to a fixed past timestamp; the patch seds above have already run, and a
      # genuine flag change still rebuilds because configure regenerates build.ninja.
      - name: Age sources so restored objects are trusted
        run: |
          find /tmp/bun /tmp/WebKit -newermt "2000-01-02" \
            -exec touch -h -d "2000-01-01T00:00:00" {} + 2>/dev/null || true
          du -sh /tmp/bun/build 2>/dev/null || echo "cold tree for $TAG"
          du -sh /tmp/WebKit 2>/dev/null || true

      - name: Configure (release, baseline, local WebKit)
        run: |
          cd /tmp/bun
          export PATH="/usr/lib/llvm-21/bin:$HOME/.bun/bin:$HOME/.cargo/bin:$PATH"
          export RUSTUP_TOOLCHAIN="$RUST_NIGHTLY" CC=/usr/lib/llvm-21/bin/clang CXX=/usr/lib/llvm-21/bin/clang++
          export BUN_WEBKIT_PATH=/tmp/WebKit
          bun scripts/build.ts --profile=release --baseline=true --webkit=local --configure-only --cacheDir=/tmp/bc
          grep -m1 march=barcelona build/release/build.ninja || { echo "::error::C/C++ not barcelona"; exit 1; }
          grep -m1 target-cpu=barcelona build/release/build.ninja || { echo "::error::Rust not barcelona"; exit 1; }

      - name: Build
        run: |
          cd /tmp/bun
          export PATH="/usr/lib/llvm-21/bin:$HOME/.bun/bin:$HOME/.cargo/bin:$PATH"
          export RUSTUP_TOOLCHAIN="$RUST_NIGHTLY" CC=/usr/lib/llvm-21/bin/clang CXX=/usr/lib/llvm-21/bin/clang++
          ninja -C build/release bun-profile
          ls -lh build/release/bun-profile

      - name: Save object tree
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/bun/build
            /tmp/WebKit
          key: obj-${{ env.TAG }}-llvm21

      - name: Dist (binary + bundled ICU + wrapper)
        run: |
          set -e
          mkdir -p dist/lib
          cp /tmp/bun/build/release/bun-profile dist/bun-barcelona
          strip dist/bun-barcelona || true
          # local-WebKit builds link ICU dynamically, so ship the runner's copy: the
          # tarball then runs on hosts whose system ICU differs (Void ships ICU 78).
          for l in libicui18n libicuuc libicudata; do
            src="/usr/lib/x86_64-linux-gnu/$l.so.$ICU_SONAME"
            test -f "$src" || { echo "::error::$l.so.$ICU_SONAME absent; runner ICU changed"; ls -1 /usr/lib/x86_64-linux-gnu/libicu*; exit 1; }
            cp -L "$src" dist/lib/
          done
          # The wrapper is load-bearing, not decoration: `readelf -d` shows no
          # RPATH/RUNPATH on the ELF, so ICU resolves only via LD_LIBRARY_PATH. Void's
          # system ICU is 77/78, so the shipped .74 set must be injected. `bun` is the
          # wrapper, `bun-barcelona` the ELF -- and $ORIGIN/lib is NOT a fallback.
          printf '%s\n' '#!/bin/sh' \
            'DIR=$(cd "$(dirname "$(readlink -f "$0")")" && pwd)' \
            'export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"' \
            'exec "$DIR/bun-barcelona" "$@"' > dist/bun
          chmod +x dist/bun dist/bun-barcelona

      # Stable asset name: releases/latest/download/bun-barcelona-linux-x64.tar.gz
      # never changes, so one link always yields the newest barcelona build.
      # Packed and uploaded here so a publish failure still leaves a downloadable binary.
      - name: Pack
        run: |
          set -e
          tar -C dist -czf "bun-barcelona-linux-x64-${VERSION}.tar.gz" .
          cp -f "bun-barcelona-linux-x64-${VERSION}.tar.gz" bun-barcelona-linux-x64.tar.gz
          sha256sum *.tar.gz | tee SHA256SUMS
          ls -lh *.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bun-barcelona
          path: bun-barcelona-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish release ${{ env.RELEASE }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          notes="Bun $VERSION built at \`-march=barcelona\` (K10: SSE3 + SSE4a + ABM/POPCNT, no SSSE3/SSE4.x/AVX), local WebKit/JavaScriptCore, bundled ICU $ICU_SONAME behind an LD_LIBRARY_PATH wrapper, from upstream oven-sh/bun@$TAG."
          assets="bun-barcelona-linux-x64.tar.gz bun-barcelona-linux-x64-${VERSION}.tar.gz SHA256SUMS"
          # --repo is mandatory: this workflow never checks itself out, so gh has no git
          # context and every call dies with "fatal: not a git repository" without it.
          if gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release upload "$RELEASE" --repo "$GITHUB_REPOSITORY" --clobber $assets
            gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --title "Bun $VERSION (barcelona, no SSE4.2)" --notes "$notes"
          else
            # shellcheck disable=SC2086
            gh release create "$RELEASE" --repo "$GITHUB_REPOSITORY" --title "Bun $VERSION (barcelona, no SSE4.2)" --notes "$notes" $assets
          fi
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json tagName,assets -q '.tagName+" "+(.assets|map(.name)|join(","))'
